version: 2
updates:
  - package-ecosystem: cargo
    directories: [/, /crates/mini_racer_wire/fuzz]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      cargo:
        update-types: [minor, patch]
    ignore:
      # A V8 bump moves the archive digests, the export allowlists and the
      # notices together; the v8-bump procedure does it, with ICU data to match.
      - dependency-name: v8
      - dependency-name: deno_core_icudata
      # Pinned equal to the rb_sys gem in mini_racer_rs.gemspec
      # (scripts/check-versions.sh); the two move in one change.
      - dependency-name: rb-sys
    open-pull-requests-limit: 5

  # The transitive check's bundle stays out: it pins rtlcss exactly and takes
  # the other two gems by path, and Dependabot evaluates path gemspecs with
  # File.read stubbed out, which the shim's version lookup cannot survive. For
  # the same reason the root bundle excludes shim/, whose gemspec Dependabot
  # otherwise finds and evaluates.
  - package-ecosystem: bundler
    directory: /
    exclude-paths: ["shim/**"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      bundler:
        update-types: [minor, patch]
    ignore:
      - dependency-name: rb_sys
      # mini_racer 0.22.1's suite runs on both bundles and requires ~> 5.0.
      - dependency-name: minitest
        update-types: [version-update:semver-major]
    open-pull-requests-limit: 5

  # The release workflow signs gems with this bundle under an OIDC token, so
  # dependabot-auto-merge.yml leaves its updates for review.
  - package-ecosystem: bundler
    directory: /release/sign
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      sign:
        update-types: [minor, patch]
    open-pull-requests-limit: 2

  # The reference bundle is the parity baseline: mini_racer and its libv8-node
  # stay at the release the suite and the differential run compare against.
  - package-ecosystem: bundler
    directory: /tools/reference
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      reference:
        update-types: [minor, patch]
    ignore:
      - dependency-name: mini_racer
      - dependency-name: libv8-node
      - dependency-name: minitest
        update-types: [version-update:semver-major]
    open-pull-requests-limit: 3

  - package-ecosystem: npm
    directories: [/, /test/consumers/js]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      npm:
        patterns: ["*"]
    open-pull-requests-limit: 3

  # The Alpine images the musl jobs run, pinned by digest: only new digests for
  # the same tags, since each names a Ruby minor or the musl floor, and
  # dependabot-auto-merge.yml leaves them for review because the release runs
  # them.
  - package-ecosystem: docker
    directory: /release/alpine
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      alpine:
        patterns: ["*"]
    ignore:
      - dependency-name: ruby
        update-types: [version-update:semver-major, version-update:semver-minor]
    open-pull-requests-limit: 2

  - package-ecosystem: github-actions
    directories: [/, /.github/actions/setup]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 5
