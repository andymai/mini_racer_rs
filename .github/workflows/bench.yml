name: Bench

# mini_racer_rs against the real mini_racer 0.22.1 on a hosted runner, weekly
# and on demand. Informational: hosted runners are shared and noisy, so the
# numbers are kept for trends and nothing fails on them.

on:
  schedule:
    - cron: "0 11 * * 0"
  workflow_dispatch:

permissions: {}

concurrency:
  group: bench
  cancel-in-progress: false

jobs:
  bench:
    name: Bench
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: ./.github/actions/setup
        with:
          ruby: "3.4"
      - name: Install the real mini_racer 0.22.1
        working-directory: tools/reference
        run: BUNDLE_PATH=vendor/bundle bundle install
      - run: bundle exec rake compile
      - name: Build the consumer bundles the workloads load
        run: (cd test/consumers/js && npm ci && npm run build)
      - name: Benchmark
        run: |
          set -o pipefail
          mkdir -p tmp
          bundle exec ruby bench/run.rb | tee tmp/bench-output.txt
          {
            echo '```'
            cat tmp/bench-output.txt
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench
          path: |
            tmp/bench
            tmp/bench-output.txt
          retention-days: 90
