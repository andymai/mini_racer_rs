name: CI

on:
  push:
    branches: [main]
  pull_request:

# Supersede in-flight runs on a PR; let every push to main finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

permissions: {}

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Docs-only PRs skip the build jobs; CI Pass counts skipped jobs as passing.
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE" ]; then
            echo "code=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          code=$(git diff --name-only "$BASE"...HEAD | grep -vE '\.md$|^LICENSE$|^\.claude/|^\.github/(ISSUE_TEMPLATE|FUNDING\.yml)' || true)
          echo "code=$([ -n "$code" ] && echo true || echo false)" >>"$GITHUB_OUTPUT"

  fmt:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install && cargo fmt --all -- --check
      - run: cargo fmt --manifest-path crates/mini_racer_wire/fuzz/Cargo.toml -- --check

  taplo:
    name: TOML Format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          v8: "false"
          tools: taplo-cli
      - run: taplo fmt --check

  rubocop:
    name: RuboCop
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rubocop
      # Here rather than in a build job, which a docs-only PR skips.
      - name: COMPATIBILITY.md and the README table match compat.toml
        run: bundle exec ruby tools/compat/render.rb --check

  machete:
    name: Unused Dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          v8: "false"
          tools: cargo-machete
      - run: cargo machete

  deny:
    name: Cargo Deny
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          v8: "false"
          tools: cargo-deny
      - run: scripts/check-deny.sh

  # A prebuilt cargo-audit: building it from source pulls the newest releases of
  # its dependencies, and one bad upstream publish then fails every run.
  audit:
    name: Security Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          v8: "false"
          tools: cargo-audit
      - run: cargo audit
      - run: cargo audit -f crates/mini_racer_wire/fuzz/Cargo.lock

  # Runs whatever changed: the notices file itself is markdown, which the
  # changes filter treats as docs.
  notices:
    name: Third-Party Notices
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Every target's archive, not just this runner's, so the scan sees what
      # each native gem links.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/mini_racer_rs/v8
          key: v8-all-${{ hashFiles('ext/mini_racer_rs/v8-archives.sha256') }}
      - uses: ./.github/actions/setup
        with:
          v8: "false"
          tools: cargo-about
      - run: scripts/update-notices.sh --check

  boundaries:
    name: Boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          v8: "false"
          tools: taplo-cli
      - run: scripts/check-boundaries.sh
      - run: scripts/test-boundaries.sh
      - run: scripts/check-unsafe-fences.sh
      - run: scripts/check-ffi-guards.sh
      - run: scripts/check-gc-roots.sh
      - run: scripts/check-statics.sh

  repo-checks:
    name: Repo Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: ./.github/actions/setup
        with:
          v8: "false"
          tools: taplo-cli
      - run: scripts/check-versions.sh
      - run: scripts/check-vendored.sh
      - run: scripts/check-action-pins.sh
      - run: scripts/check-scheduled-watch.sh
      - run: scripts/check-platforms.sh
      - run: scripts/check-prose.sh
      - run: scripts/check-doc-paths.sh
      - run: scripts/test-claude-hooks.sh

  msrv:
    name: MSRV
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          ruby: "3.4"
      - name: Check on the minimum supported Rust
        run: |
          msrv=$(sed -nE 's/^msrv = "([^"]+)"$/\1/p' tools/versions.toml)
          rustup toolchain install "$msrv" --profile minimal
          cargo "+$msrv" check --workspace --all-targets --locked

  rustdoc:
    name: Rustdoc
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          ruby: "3.4"
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  clippy:
    name: Clippy
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          ruby: "3.4"
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # The extension crate is excluded: its test binary links libruby, so its
  # unit tests run in the Ruby jobs.
  rust-test:
    name: Rust Tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tools: cargo-nextest
      - run: cargo nextest run --workspace --exclude mini_racer_rs --locked
      # nextest does not run doctests, so they get their own step.
      - run: cargo test --doc --workspace --exclude mini_racer_rs --locked
      # The wire tests decode these bytes, so they must still be what V8 writes.
      - name: Wire golden bytes match V8
        run: |
          cargo run -q -p mini_racer_engine --example gen_wire_golden --locked
          drift=$(git status --porcelain -- crates/mini_racer_wire/tests/golden)
          if [ -n "$drift" ]; then
            echo "$drift"
            echo "::error::The wire golden bytes differ from what V8 writes. Run cargo run -p mini_racer_engine --example gen_wire_golden, then UPDATE_GOLDEN=1 cargo test -p mini_racer_wire --test golden, and read every changed .txt before committing."
            exit 1
          fi

  loom:
    name: Loom
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          v8: "false"
      - run: cargo test -p mini_racer_sync --test loom --release --locked --target-dir target/loom
        env:
          RUSTFLAGS: --cfg loom -Dwarnings

  fuzz-smoke:
    name: Fuzz Smoke
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          v8: "false"
          tools: cargo-fuzz
          cache-workspaces: crates/mini_racer_wire/fuzz -> target
      - run: scripts/fuzz-smoke.sh 60
      - name: Keep crash inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: crates/mini_racer_wire/fuzz/artifacts

  gem-verify:
    name: Gem Contents
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          ruby: "3.4"
          v8: "false"
      - name: Build both gemspecs
        run: |
          mkdir -p tmp
          gem build mini_racer_rs.gemspec --output tmp/mini_racer_rs.gem
          gem build shim/mini_racer.gemspec --output tmp/mini_racer-shim.gem
      - name: Check the source gem file list
        run: |
          files=$(tar -xOf tmp/mini_racer_rs.gem data.tar.gz | tar -tz)
          for required in Cargo.toml Cargo.lock ext/mini_racer_rs/extconf.rb ext/mini_racer_rs/v8-archives.sha256 \
            lib/mini_racer.rb lib/mini_racer_rs.rb crates/mini_racer_engine/src/lib.rs LICENSE THIRD_PARTY_NOTICES.md \
            licenses/mini_racer.txt licenses/v8/SOURCES.tsv licenses/v8/v8/LICENSE; do
            grep -qx "$required" <<<"$files" || { echo "missing $required"; exit 1; }
          done
          forbidden=$(grep -E '^(\.cargo|\.github|target|test|scripts|tools|vendor|bin|node_modules)/|rust-toolchain\.toml|\.(so|bundle)$' <<<"$files" || true)
          [ -z "$forbidden" ] || { echo "unexpected files:"; echo "$forbidden"; exit 1; }
          [ -z "$(tar -xOf tmp/mini_racer-shim.gem data.tar.gz | tar -tz)" ] || { echo "shim gem has files"; exit 1; }
      - name: Unpacked source gem resolves with its own lockfile
        run: |
          gem unpack tmp/mini_racer_rs.gem --target tmp/unpacked
          cd tmp/unpacked/mini_racer_rs
          cargo metadata --locked --format-version 1 >/dev/null

  ruby:
    name: Ruby ${{ matrix.ruby }} (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        ruby: ["3.3", "3.4", "4.0"]
        include:
          - os: ubuntu-24.04-arm
            ruby: "3.4"
          - os: macos-15-intel
            ruby: "3.4"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: ./.github/actions/setup
        with:
          ruby: ${{ matrix.ruby }}
      - run: bundle exec rake compile
      # A mismatch leaves the built list in the allowlist file and uploads it, since
      # the macOS list cannot be regenerated on Linux.
      - name: Check exports
        id: exports
        env:
          ARTIFACT: exports-${{ matrix.os }}-ruby-${{ matrix.ruby }}
        run: |
          if ! scripts/check-exports.sh; then
            scripts/check-exports.sh --write
            allow=$(git diff --name-only -- 'ext/mini_racer_rs/exports.allow.*')
            # The allowlist matched; the failure is another export rule.
            [ -n "$allow" ] || exit 1
            echo "allow=$allow" >>"$GITHUB_OUTPUT"
            echo "::group::Changes to $allow"
            git diff -- "$allow"
            echo "::endgroup::"
            echo "::error file=$allow::The built exports differ from $allow. Commit $allow from the $ARTIFACT artifact, or run scripts/check-exports.sh --write on this OS."
            exit 1
          fi
      - name: Keep the built export list
        if: failure() && steps.exports.outputs.allow != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: exports-${{ matrix.os }}-ruby-${{ matrix.ruby }}
          path: ${{ steps.exports.outputs.allow }}
          retention-days: 14
      - run: bundle exec rake test
      - name: Fork stress
        run: bundle exec ruby -Ilib test/stress/fork_loop.rb
      # glibc keeps what a thread frees unless asked; macOS's allocator differs.
      - name: Memory per context after loading a large script, both V8 platform modes
        if: runner.os == 'Linux'
        run: |
          bundle exec ruby -Ilib test/stress/large_load.rb single
          bundle exec ruby -Ilib test/stress/large_load.rb multi
      - name: Memory per context sharing one large script's source, both V8 platform modes
        if: runner.os == 'Linux'
        run: |
          bundle exec ruby -Ilib test/stress/shared_load.rb single
          bundle exec ruby -Ilib test/stress/shared_load.rb multi
      - name: Memory a process keeps after large scripts each loaded once, both V8 platform modes
        if: runner.os == 'Linux'
        run: |
          bundle exec ruby -Ilib test/stress/one_off_load.rb single
          bundle exec ruby -Ilib test/stress/one_off_load.rb multi
      - name: Forks from a multi-threaded parent while other threads evaluate
        run: bundle exec ruby -Ilib test/stress/fork_busy.rb 300 4
      # The margin was calibrated on Linux; macOS's allocator returns memory differently.
      - name: A multi-threaded fork child's memory against its parent's
        if: runner.os == 'Linux'
        run: bundle exec ruby -Ilib test/stress/fork_child_memory.rb
      - name: ExecJS calls with equal-length large arguments stay as fast as the first
        run: bundle exec ruby -Ilib -Ivendor/execjs/lib test/stress/large_arguments.rb
      # On macOS spawns go through fork() and the engine's fork handlers.
      - name: Spawns under context churn, both V8 platform modes
        run: |
          bundle exec ruby -Ilib test/stress/spawn_churn.rb single
          bundle exec ruby -Ilib test/stress/spawn_churn.rb multi
      - name: A fork child without the madvise wrapper crashes
        if: matrix.os == 'ubuntu-24.04' && matrix.ruby == '3.4'
        run: scripts/madvise-fixture.sh
      - name: Extension unit tests
        run: cargo test -p mini_racer_rs --lib --locked
      - name: Compatibility ledger
        run: bundle exec rake compat:check
      # Every Ruby 3.4 leg compares against the real gem, so a difference that
      # shows on one platform only (a crash, a conversion) is seen.
      - name: Install the real mini_racer 0.22.1
        if: matrix.ruby == '3.4'
        working-directory: tools/reference
        run: BUNDLE_PATH=vendor/bundle bundle install
      # compat/surface.json is reflected from the real gem; this re-reflects it.
      - name: Compatibility surface against the real mini_racer
        if: matrix.os == 'ubuntu-24.04' && matrix.ruby == '3.4'
        run: bundle exec rake compat:verify
      # The second copy of the real gem must agree with the first, or the harness itself is unsound.
      - name: Differential run against the real mini_racer
        if: matrix.ruby == '3.4'
        run: bundle exec ruby test/diff/run.rb --twin --strict
      - name: Consumer workloads against the real mini_racer
        if: matrix.ruby == '3.4'
        run: |
          (cd test/consumers/js && npm ci && npm run build)
          bundle exec ruby test/diff/run.rb --set consumers --twin --strict
      - name: A transitive dependent resolves to mini_racer_rs
        if: matrix.os == 'ubuntu-24.04' && matrix.ruby == '3.4'
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/test/consumers/transitive/Gemfile
          BUNDLE_FROZEN: "true"
        run: |
          bundle install
          bundle exec ruby test/consumers/transitive/check.rb
      - name: Benchmark smoke (informational)
        if: matrix.os == 'ubuntu-24.04' && matrix.ruby == '3.4'
        run: bundle exec ruby bench/run.rb --quick
      # mini_racer's own suite, unmodified; every result must match the ledger.
      - name: Upstream suite (strict)
        run: bundle exec ruby test/upstream/run.rb --strict --seed "${{ github.run_number }}"
      - name: ExecJS contract suite (strict)
        run: bundle exec ruby test/upstream/run.rb --suite execjs --strict --seed "${{ github.run_number }}"
      - name: Upstream scripts (recorded until their milestone)
        if: matrix.os == 'ubuntu-24.04' && matrix.ruby == '3.4'
        run: bundle exec ruby test/upstream/run.rb --scripts
      - name: Keep upstream run logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upstream-${{ matrix.os }}-${{ matrix.ruby }}
          path: |
            tmp/upstream
            tmp/diff
          retention-days: 7
      # S1: the source gem installs into an empty GEM_HOME and loads. The setup
      # action's pre-fetched V8 variables are dropped so extconf's pin is what runs.
      - name: Install the source gem from scratch
        if: matrix.ruby == '3.4'
        run: |
          unset RUSTY_V8_ARCHIVE RUSTY_V8_SRC_BINDING_PATH RUSTY_V8_ARCHIVE_SHA256
          mkdir -p tmp
          gem build mini_racer_rs.gemspec --output tmp/mini_racer_rs.gem
          export GEM_HOME="$RUNNER_TEMP/gem-home" GEM_PATH="$RUNNER_TEMP/gem-home"
          rb_sys=$(sed -nE 's/^ *spec\.add_dependency "rb_sys", "= ([^"]+)"$/\1/p' mini_racer_rs.gemspec)
          gem install rb_sys -v "$rb_sys" --no-document
          gem install --local tmp/mini_racer_rs.gem --no-document
          cd "$RUNNER_TEMP"
          ruby -e 'require "mini_racer"; p MiniRacer::Context.new.eval("1+1")' | grep -qx 2

  # TruffleRuby runs upstream's own TruffleRuby backend, vendored unchanged; this
  # proves the loader picks it and the harness guard holds on a second engine.
  truffleruby:
    name: TruffleRuby
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      BUNDLE_WITHOUT: "lint scheduler"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: truffleruby+graalvm-40.0.0
          bundler-cache: true
      - run: truffleruby-polyglot-get js
      - run: bundle exec ruby -Itest/ruby -Ilib test/ruby/harness_guard_test.rb
      - name: Install the real mini_racer 0.22.1
        working-directory: tools/reference
        run: BUNDLE_PATH=vendor/bundle bundle install
      # rake needs the lint group, which this job skips.
      - name: Compatibility ledger and surface
        run: |
          bundle exec ruby -Ilib tools/compat/reflect.rb --out tmp/compat/candidate-truffleruby.json
          BUNDLE_GEMFILE="$PWD/tools/reference/Gemfile" BUNDLE_PATH="$PWD/tools/reference/vendor/bundle" \
            bundle exec ruby tools/compat/reflect.rb --reference --out tmp/compat/reference-truffleruby.json
          bundle exec ruby tools/compat/check.rb tmp/compat/candidate-truffleruby.json tmp/compat/reference-truffleruby.json
      - name: Upstream suite (strict)
        run: bundle exec ruby test/upstream/run.rb --strict --seed "${{ github.run_number }}"
      - name: ExecJS contract suite (strict)
        run: bundle exec ruby test/upstream/run.rb --suite execjs --strict --seed "${{ github.run_number }}"

  gc-stress:
    name: GC Stress
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: ./.github/actions/setup
        with:
          ruby: "3.4"
      - run: bundle exec rake compile
      - name: Upstream conversion tests under GC.stress with compaction
        run: bundle exec ruby test/upstream/run.rb --gc-stress --strict
      - name: Ruby tests with compaction on every major collection
        env:
          MINI_RACER_RS_AUTO_COMPACT: "1"
        run: bundle exec rake test

  # The release's sign job installs this bundle only on a tag, so this catches
  # an update that no longer installs, checksums missing from its lockfile, or
  # a signer that waits instead of failing without an OIDC token, before a
  # release ships gems without attestations.
  sign-bundle:
    name: Sign Bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: "3.4"
      - name: Every locked gem has a checksum
        run: |
          lock=release/sign/Gemfile.lock
          specs=$(awk '/^GEM$/ {g = 1} g && /^    [^ ]/ {print $1, $2} /^$/ {g = 0}' "$lock" | sort)
          sums=$(awk '/^CHECKSUMS$/ {c = 1; next} c && /^  [^ ]/ && / sha256=/ {print $1, $2} /^$/ {c = 0}' "$lock" | sort)
          if [ -z "$specs" ] || [ "$specs" != "$sums" ]; then
            echo "::error file=$lock::every locked gem needs a sha256 checksum"
            diff <(echo "$specs") <(echo "$sums") || true
            exit 1
          fi
      - name: Without an OIDC token, signing fails at once and warns
        run: |
          mkdir -p "$RUNNER_TEMP/pkg"
          : >"$RUNNER_TEMP/pkg/probe.gem"
          started=$SECONDS
          scripts/sign-gems.sh "$RUNNER_TEMP/pkg" | tee "$RUNNER_TEMP/sign.log"
          grep -q 'signing probe.gem failed' "$RUNNER_TEMP/sign.log"
          test ! -e "$RUNNER_TEMP/pkg/probe.gem.sigstore.json"
          test $((SECONDS - started)) -lt 300

  # Fails on findings the PR adds, or when either scan cannot finish: the
  # reusable workflow scans the base and the head and compares them, so an
  # advisory against a version already on main fails osv-scan.yml's runs
  # instead. Only PRs from this repository upload SARIF, since a fork's PR runs
  # with a read-only token.
  osv:
    name: OSV Scan (new findings)
    if: github.event_name == 'pull_request'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    with:
      scan-args: |-
        --config=osv-scanner.toml
        --lockfile=Cargo.lock
        --lockfile=crates/mini_racer_wire/fuzz/Cargo.lock
        --lockfile=Gemfile.lock
        --lockfile=package-lock.json
        --lockfile=tools/reference/Gemfile.lock
        --lockfile=test/consumers/js/package-lock.json
        --lockfile=test/consumers/transitive/Gemfile.lock
      upload-sarif: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    # A caller must grant every permission the called workflow declares, or the
    # run fails at startup.
    permissions:
      actions: read
      contents: read
      security-events: write

  # !cancelled() rather than always(): a run superseded by a newer push must
  # not report a failing gate for its commit.
  ci-pass:
    name: CI Pass
    if: ${{ !cancelled() }}
    needs: [changes, fmt, taplo, rubocop, machete, deny, audit, notices, boundaries, repo-checks, msrv, rustdoc, clippy, rust-test, loom, fuzz-smoke, gem-verify, ruby, truffleruby, gc-stress, sign-bundle, osv]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check all jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")' >/dev/null
