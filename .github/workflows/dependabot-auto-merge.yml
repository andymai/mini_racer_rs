name: Dependabot Auto-merge

on:
  pull_request:
    types: [opened, synchronize]

permissions: {}

jobs:
  auto-merge:
    name: Auto-merge
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # The actor alone is spoofable (Dependabot can be the actor on an event for a
    # PR it did not write), so the PR's author and branch must be Dependabot's too.
    if: >-
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      pull-requests: write
    env:
      HAS_APP: ${{ secrets.RELEASE_KUN_APP_ID != '' && secrets.RELEASE_KUN_APP_PRIVATE_KEY != '' }}
    steps:
      - uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        id: metadata
      # A merge made with GITHUB_TOKEN starts no workflows, so main's CI and the
      # blocking OSV scan would skip it; the release-kun App's merge starts them.
      # Dependabot's runs see only Dependabot secrets, so the App's two secrets
      # must be set there as well as for Actions.
      - name: Mint release-kun App token
        id: app-token
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_KUN_APP_ID }}
          private-key: ${{ secrets.RELEASE_KUN_APP_PRIVATE_KEY }}
      # --auto waits for the required checks; majors stay manual, and so does
      # release/sign, whose gems run in the release workflow with an OIDC token.
      - name: Queue patch and minor updates for merge
        if: >-
          steps.metadata.outputs.update-type != 'version-update:semver-major' &&
          steps.metadata.outputs.directory != '/release/sign'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge "$PR_URL" --auto --squash
