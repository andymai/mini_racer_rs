name: Mutants

# Weekly mutation testing, reported and never gated: cargo-mutants on the wire
# codec against its tests and the engine's, in four shards, and on the sync
# crate against its tests, whose surviving mutants then meet the loom models.
# The report job writes the counts and every surviving mutant to the run
# summary, and each run's mutants.out is uploaded. Runs on demand, and on a PR
# while it carries the mutants label; adding any other label does not restart it.

on:
  schedule:
    - cron: "0 13 * * 6"
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]

concurrency:
  group: mutants-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  wire:
    name: Mutants, wire (shard ${{ matrix.shard }} of 4)
    if: github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'mutants') && (github.event.action != 'labeled' || github.event.label.name == 'mutants'))
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    # Each of a shard's 90 or so mutants rebuilds and runs the engine's tests.
    timeout-minutes: 150
    permissions:
      contents: read
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tools: cargo-mutants cargo-nextest
      - env:
          SHARD: ${{ matrix.shard }}
        run: scripts/mutants.sh wire "$SHARD/4"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: mutants-wire-${{ matrix.shard }}
          path: tmp/mutants/wire-${{ matrix.shard }}
          if-no-files-found: warn
          retention-days: 30

  sync:
    name: Mutants, sync
    if: github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'mutants') && (github.event.action != 'labeled' || github.event.label.name == 'mutants'))
    runs-on: ubuntu-24.04
    # About 50 of its 320 or so mutants hang the tests until the 20 s timeout.
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          v8: "false"
          tools: cargo-mutants cargo-nextest
      - run: scripts/mutants.sh sync
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: mutants-sync
          path: tmp/mutants/sync
          if-no-files-found: warn
          retention-days: 30

  loom:
    name: Mutants, sync under loom
    needs: sync
    if: github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'mutants') && (github.event.action != 'labeled' || github.event.label.name == 'mutants'))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          v8: "false"
          tools: cargo-mutants
          cache-workspaces: ". -> target/loom"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mutants-sync
          path: tmp/mutants/sync
      - run: scripts/mutants.sh loom
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: mutants-sync-loom
          path: tmp/mutants/loom
          if-no-files-found: warn
          retention-days: 30

  # Whatever the runs before it finished, so a shard that timed out still
  # leaves the others' results.
  report:
    name: Mutants report
    needs: [wire, sync, loom]
    if: >-
      !cancelled() && (github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'mutants') &&
       (github.event.action != 'labeled' || github.event.label.name == 'mutants')))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutants-*
          path: tmp/mutants
      - name: Summary
        run: |
          shopt -s nullglob
          {
            echo "## Mutants"
            echo
            scripts/mutants.sh report tmp/mutants/*
          } >>"$GITHUB_STEP_SUMMARY"
