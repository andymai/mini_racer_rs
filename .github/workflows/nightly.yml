name: Nightly

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]

# Each label gets its own group, so adding one label does not cancel the job
# another label started.
concurrency:
  group: nightly-${{ github.event.pull_request.number || github.run_id }}-${{ github.event.action == 'labeled' && github.event.label.name || 'push' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  sanitizers:
    name: Sanitizers
    if: github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'sanitizers') && (github.event.action != 'labeled' || github.event.label.name == 'sanitizers'))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tools: taplo-cli
          cache-workspaces: ". -> target/asan"
      - name: Ensure llvm-symbolizer
        run: |
          command -v llvm-symbolizer || find /usr/bin -name 'llvm-symbolizer-*' | grep -q . ||
            { sudo apt-get update && sudo apt-get install -y llvm; }
      - run: scripts/sanitizers.sh

  # Memory growth over long runs, which no PR job runs long enough to see.
  stress:
    name: Stress (${{ matrix.os }})
    if: github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'stress') && (github.event.action != 'labeled' || github.event.label.name == 'stress'))
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          ruby: "3.4"
      - run: bundle exec rake compile
      # Each run is its own step, so one failure does not hide the others.
      - name: Round trips on one context, single-threaded platform
        if: ${{ !cancelled() }}
        run: bundle exec ruby -Ilib test/stress/round_trips.rb single 10000000
      - name: Round trips on one context, multi-threaded platform
        if: ${{ !cancelled() }}
        run: bundle exec ruby -Ilib test/stress/round_trips.rb multi 10000000
      - name: Context churn from 8 threads, single-threaded platform
        if: ${{ !cancelled() }}
        run: bundle exec ruby -Ilib test/stress/churn.rb single 8 600
      - name: Context churn from 8 threads, multi-threaded platform
        if: ${{ !cancelled() }}
        run: bundle exec ruby -Ilib test/stress/churn.rb multi 8 600
      - name: Heap limit hits, single-threaded platform
        if: ${{ !cancelled() }}
        run: bundle exec ruby -Ilib test/stress/heap_limit.rb single 300
      - name: Heap limit hits, multi-threaded platform
        if: ${{ !cancelled() }}
        run: bundle exec ruby -Ilib test/stress/heap_limit.rb multi 300
      - name: Pool replacements under 8 threads, single-threaded platform
        if: ${{ !cancelled() }}
        run: bundle exec ruby -Ilib test/stress/pool_churn.rb single 8 180
      - name: Pool replacements under 8 threads, multi-threaded platform
        if: ${{ !cancelled() }}
        run: bundle exec ruby -Ilib test/stress/pool_churn.rb multi 8 180

  # Every fuzz target for 15 minutes on the pinned nightly: three, 45 minutes,
  # with room for setup and the nightly's build.
  fuzz:
    name: Fuzz
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          v8: "false"
          tools: cargo-fuzz
          cache-workspaces: crates/mini_racer_wire/fuzz -> target
      - run: scripts/fuzz-smoke.sh 900
      - name: Keep crashes
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: crates/mini_racer_wire/fuzz/artifacts
          retention-days: 14

  # Fresh seeds against the real gem for 30 minutes, cases sharing no object;
  # each divergence the accepted ones miss is minimized into a corpus case.
  diff:
    name: Differential, fresh seeds
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          ruby: "3.4"
      - name: Install the real mini_racer 0.22.2
        working-directory: tools/reference
        run: BUNDLE_PATH=vendor/bundle bundle install
      - run: bundle exec rake compile
      - name: Explore for 30 minutes
        env:
          FIRST_SEED: ${{ github.run_id }}
        run: |
          seed=$((FIRST_SEED % 1000000000))
          end=$((SECONDS + 1800))
          while [ "$SECONDS" -lt "$end" ]; do
            bundle exec ruby test/diff/run.rb --explore --shrink --seed "$seed" --js 1500 --ruby 1500
            seed=$((seed + 1))
          done
      - name: Keep results and minimized cases
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diff-explore
          path: |
            tmp/diff
            test/diff/corpus/min-*.json
          retention-days: 14
