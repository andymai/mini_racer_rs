name: OSV Scan

# Complements the Dependabot cooldown: the cooldown keeps fresh, untrusted
# versions out of update PRs, and OSV catches known-bad versions already in the
# lockfiles. PRs only report; main and the weekly run fail on a finding.
# osv-scanner.toml lists accepted advisories, each with the change that removes it.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A second push to main must not cancel the scan of the first.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

jobs:
  scan-pr:
    name: OSV Scan (report-only)
    if: github.event_name == 'pull_request'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    with:
      scan-args: |-
        --config=osv-scanner.toml
        --lockfile=Cargo.lock
        --lockfile=crates/mini_racer_wire/fuzz/Cargo.lock
        --lockfile=Gemfile.lock
        --lockfile=package-lock.json
        --lockfile=tools/reference/Gemfile.lock
        --lockfile=test/consumers/js/package-lock.json
        --lockfile=test/consumers/transitive/Gemfile.lock
      fail-on-vuln: false
      upload-sarif: true
    # A caller must grant every permission the called workflow declares, or the
    # run fails at startup.
    permissions:
      actions: read
      contents: read
      security-events: write

  scan-main:
    name: OSV Scan (blocking)
    if: github.event_name != 'pull_request'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    with:
      scan-args: |-
        --config=osv-scanner.toml
        --lockfile=Cargo.lock
        --lockfile=crates/mini_racer_wire/fuzz/Cargo.lock
        --lockfile=Gemfile.lock
        --lockfile=package-lock.json
        --lockfile=tools/reference/Gemfile.lock
        --lockfile=test/consumers/js/package-lock.json
        --lockfile=test/consumers/transitive/Gemfile.lock
      upload-sarif: true
    permissions:
      actions: read
      contents: read
      security-events: write
