name: OSV Scan

# Complements the Dependabot cooldown: the cooldown keeps fresh, untrusted
# versions out of update PRs, and OSV catches known-bad versions already in the
# lockfiles. Main and the weekly run fail on any finding; pull requests are
# scanned by the `osv` job in ci.yml, which CI Pass gates.
# osv-scanner.toml lists accepted advisories, each with the change that removes it.

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions: {}

jobs:
  scan-main:
    name: OSV Scan (blocking)
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    with:
      scan-args: |-
        --config=osv-scanner.toml
        --lockfile=Cargo.lock
        --lockfile=crates/mini_racer_wire/fuzz/Cargo.lock
        --lockfile=Gemfile.lock
        --lockfile=package-lock.json
        --lockfile=tools/reference/Gemfile.lock
        --lockfile=release/sign/Gemfile.lock
        --lockfile=test/consumers/js/package-lock.json
        --lockfile=test/consumers/transitive/Gemfile.lock
      upload-sarif: true
    permissions:
      actions: read
      contents: read
      security-events: write
