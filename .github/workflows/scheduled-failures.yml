name: Scheduled Failures

on:
  workflow_run:
    workflows: [Nightly, Extended, Bench, OSV Scan, Upstream Watch]
    types: [completed]

permissions: {}

jobs:
  # A job that runs past its timeout ends the run as cancelled, not timed_out.
  report:
    name: Report a failed scheduled run
    if: >-
      github.event.workflow_run.event == 'schedule' &&
      contains(fromJSON('["failure", "timed_out", "startup_failure", "cancelled"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
        run: scripts/report-scheduled-failure.sh
