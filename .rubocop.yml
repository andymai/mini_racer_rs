plugins:
  - rubocop-minitest
  - rubocop-performance
  - rubocop-rake

AllCops:
  NewCops: enable
  SuggestExtensions: false
  TargetRubyVersion: 3.3
  Exclude:
    - "lib/mini_racer/shared.rb"
    - "lib/mini_racer/truffleruby.rb"
    - "node_modules/**/*"
    - "target/**/*"
    - "tmp/**/*"
    - "vendor/**/*"
    - "**/vendor/**/*"

Style/Documentation:
  Enabled: false

# vocabulary.rb reproduces mini_racer's Ruby code as written, and Context#load
# calls the JavaScript eval method, not Kernel#eval.
Metrics/MethodLength:
  Exclude:
    - "bench/**/*"
    - "lib/mini_racer_rs/vocabulary.rb"
    - "test/**/*"
    - "tools/**/*"

Metrics/AbcSize:
  Exclude:
    - "bench/**/*"
    - "rakelib/**/*"
    - "test/**/*"
    - "tools/**/*"

Metrics/ModuleLength:
  Exclude:
    - "bench/**/*"
    - "tools/**/*"

Metrics/BlockLength:
  Exclude:
    - "*.gemspec"
    - "rakelib/**/*"
    - "test/**/*"

Metrics/CyclomaticComplexity:
  Exclude:
    - "bench/**/*"
    - "rakelib/**/*"
    - "test/**/*"
    - "tools/**/*"

Metrics/PerceivedComplexity:
  Exclude:
    - "bench/**/*"
    - "rakelib/**/*"
    - "test/**/*"
    - "tools/**/*"

Minitest/MultipleAssertions:
  Max: 10

Security/Eval:
  Exclude:
    - "lib/mini_racer_rs/vocabulary.rb"

Style/FileOpen:
  Exclude:
    - "lib/mini_racer_rs/vocabulary.rb"

Style/SuperArguments:
  Exclude:
    - "lib/mini_racer_rs/vocabulary.rb"

# MiniRacer::Context#eval runs JavaScript, not a Ruby definition.
Style/DocumentDynamicEvalDefinition:
  Exclude:
    - "bench/**/*"
    - "test/**/*"

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Style/TrailingCommaInArguments:
  EnforcedStyleForMultiline: consistent_comma

Style/TrailingCommaInArrayLiteral:
  EnforcedStyleForMultiline: consistent_comma

Style/TrailingCommaInHashLiteral:
  EnforcedStyleForMultiline: consistent_comma
