[workspace]
exclude = ["crates/mini_racer_wire/fuzz"]
members = [
  "crates/mini_racer_engine",
  "crates/mini_racer_sync",
  "crates/mini_racer_wire",
  "ext/mini_racer_rs",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
repository = "https://github.com/andymai/mini_racer_rs"
rust-version = "1.91"
version = "0.0.0"

[workspace.dependencies]
deno_core_icudata = "=0.78.0"
libc = "0.2"
magnus = {version = "=0.9.2", features = ["rb-sys"]}
mini_racer_engine = {path = "crates/mini_racer_engine"}
mini_racer_wire = {path = "crates/mini_racer_wire"}
rb-sys = "=0.9.130"
thiserror = "2"
v8 = "=152.2.0"

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = {level = "deny", priority = -1}
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
exit = "deny"
mem_forget = "deny"
multiple_unsafe_ops_per_block = "deny"
nursery = {level = "warn", priority = -1}
panic = "deny"
pedantic = {level = "warn", priority = -1}
print_stderr = "deny"
print_stdout = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
# Internal crates with no published API surface.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"

[profile.release]
debug = "line-tables-only"
# FFI guards (invariant I4) turn panics into errors, which needs unwinding.
panic = "unwind"
