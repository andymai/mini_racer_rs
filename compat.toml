# Status of each public id of mini_racer 0.22.1 (compat/surface.json) in mini_racer_rs.
# A status describes CRuby; on TruffleRuby mini_racer_rs runs upstream's backend.
# status = "done" | "todo:<milestone>" | "deviation" (with reason, then approved = "YYYY-MM-DD" once reviewed).

[ids."behavior:bigint-objects@ruby"]
reason = "mini_racer_rs returns a BigInt wrapper object's wrapped value as an Integer: `Object(1n)` returns `1`, and `[Object(-5n)]` returns `[-5]`. mini_racer 0.22.1 instead raises `MiniRacer::RuntimeError` with the message `bad tag: z`. Returning the primitive value makes BigInt wrappers consistent with Boolean, Number, and String wrapper objects, which both gems already return as their primitive values."
status = "deviation"

[ids."behavior:object-ids@ruby"]
reason = "mini_racer_rs preserves repeated object references by numbering every serialized object as V8 does. For `(() => { const d = new Date(0); const o = {}; return [d, d, o, o] })()`, it returns `[Time, Time, {}, {}]`, with identical Ruby objects for each pair. mini_racer 0.22.1 returns `[Time, nil, {}, nil]` because its reference list omits dates, regular expressions, typed arrays, and other objects that V8 numbers. Similarly, a self-referential error cause remains the error itself in mini_racer_rs but becomes an empty Array in mini_racer 0.22.1."
status = "deviation"

[ids."behavior:platforms@ruby"]
reason = "mini_racer_rs supports glibc Linux on x86_64 and aarch64, plus macOS on arm64 and x86_64. Installation stops on musl-based Linux, including Alpine, and on Windows, with a message naming the supported platforms."
status = "deviation"

[ids."behavior:timeout-watchdog@ruby"]
reason = "mini_racer_rs raises MiniRacer::InternalError when its single process-wide watchdog thread cannot start, and the timed script does not run. mini_racer 0.22.1 starts a watchdog thread for each eval or call on a context created with timeout:; if creation fails, it prints mini_racer: watchdog: pthread_create: <error> to stderr and runs the script without a time limit. This difference prevents a failed watchdog from silently removing the bound often placed on untrusted JavaScript."
status = "deviation"

[ids."behavior:typed-array-offsets@ruby"]
reason = "mini_racer_rs returns a typed array or DataView at any byte offset as a binary (`ASCII-8BIT`) String containing the view's whole ArrayBuffer, consistent with both gems at offset 0. mini_racer 0.22.1 instead raises `MiniRacer::RuntimeError` with `bad typed array` for offsets such as those in `new Uint8Array(new ArrayBuffer(8), 4)` and `new DataView(new ArrayBuffer(4), 1, 2)`. Its decoder checks the byte after the view type, so offsets whose first encoded byte matches a view type letter can pass, including offset 66 for `B`."
status = "deviation"

[ids."behavior:uncloneable-after-filter@ruby"]
reason = "mini_racer_rs returns an error Hash when a result remains uncloneable after both gems copy it through mini_racer's filter function, which keeps enumerable data and drops functions. For example, `({a: Symbol(\"s\")})` returns `{\"error\" => \"Error: Symbol(s) could not be cloned.\"}`. A Map with a function key is another such case. mini_racer 0.22.1 aborts the Ruby process with signal 6 (SIGABRT), although its code contains the fallback that returns V8's message in a Hash. mini_racer_rs uses that fallback."
status = "deviation"

[ids."behavior:v8-version@ruby"]
reason = "On CRuby, `mini_racer_rs` embeds V8 15.2.124.1 through the `v8` crate 152.2.0, while `mini_racer` 0.22.1 uses V8 13.6.233.17 through `libv8-node` 24.12.0.1. V8-generated text, including parse and runtime error messages and locale formatting, can therefore differ. Affected upstream tests are marked `deviation:behavior:v8-version@ruby` in `test/upstream/mini_racer.status.toml`. This difference does not apply on TruffleRuby, where both gems use upstream's GraalJS backend."
status = "deviation"

