# Accepted differences between mini_racer 0.22.1 and mini_racer_rs in the
# differential run. Each one names the compat.toml deviation it falls under and
# matches one step's reference and candidate outcomes by regex over their JSON,
# or by a named structure from DiffShapes::STRUCTURES instead of the regexes:
#
# [[divergences]]
# id = "kebab-case-name"
# compat = "behavior:v8-version@ruby"
# expected = "regex over the reference outcome of the step"
# actual = "regex over the candidate outcome of the step"

[[divergences]]
compat = "behavior:object-ids@ruby"
id = "reference-to-a-numbered-object"
structure = "lost-reference"

[[divergences]]
actual = '^\["hash",\[\[\["string","UTF-8","text","error"\],\["string","UTF-8","text","Error: .* could not be cloned\."\]\]\]\]$'
compat = "behavior:uncloneable-after-filter@ruby"
expected = '^\["crash","signal 6"\]$'
id = "uncloneable-after-filter"

[[divergences]]
actual = '\["string","ASCII-8BIT","hex","[0-9a-f]*"\]'
compat = "behavior:typed-array-offsets@ruby"
expected = '^\["raise","MiniRacer::RuntimeError",\["string","ASCII-8BIT","hex","626164207479706564206172726179"\]\]$'
id = "view-at-an-offset"

[[divergences]]
actual = '\["int","-?\d+"\]'
compat = "behavior:bigint-objects@ruby"
expected = '^\["raise","MiniRacer::RuntimeError",\["string","ASCII-8BIT","hex","626164207461673a207a"\]\]$'
id = "bigint-object"

[[divergences]]
actual = '^\["(?!raise)'
compat = "behavior:padded-two-byte-text@ruby"
expected = '^\["raise","MiniRacer::RuntimeError",\["string","ASCII-8BIT","hex","(?:62616420726567657870|62616420737472696e67206f626a656374)"\]\]$'
id = "padded-two-byte-text"
