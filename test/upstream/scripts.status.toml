expected_exit = 0
milestone = "S6"
timeout_s = 60

[scripts."test/test_leak.rb"]
expected_exit = 0
milestone = "M3"
timeout_s = 300

[scripts."test/test_multithread.rb"]
expected_exit = 0
milestone = "M3"
timeout_s = 120
