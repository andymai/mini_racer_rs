# Upstream's standalone scripts. Before its milestone is done a script runs and
# its outcome is recorded; afterwards a wrong exit fails the run.

[scripts."test/test_crash.rb"]
expected_exit = 0
milestone = "M9"
timeout_s = 14400
weekly = true

