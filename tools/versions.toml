# Pinned developer and CI tool versions. The CI setup action and bin/setup read this file.
[cargo]
cargo-about = "0.9.2"
cargo-audit = "0.22.2"
cargo-deny = "0.20.2"
cargo-fuzz = "0.13.2"
cargo-llvm-cov = "0.9.1"
cargo-machete = "0.9.2"
cargo-mutants = "27.1.0"
cargo-nextest = "0.9.143"
taplo-cli = "0.9.3"

[toolchains]
# Nightly for cargo-fuzz, sanitizer builds and branch coverage.
fuzz = "nightly-2026-10-01"
msrv = "1.91.0"

# Submodule pins: the tag each tracks and the commit that tag names.
[upstream.execjs]
commit = "b8a5855917b0cf368b1e6bf34958f92e5148dd88"
tag = "v2.10.2"

[upstream.mini_racer]
commit = "d8c91a2d7895f0460f3081739456413d2589da72"
tag = "v0.22.2"

# Native gems: one extension per Ruby minor, built to these platform floors.
# The musl gems' Alpine images are pinned in release/alpine/Dockerfile.
[release]
glibc = "2.35"
macos = "13.0"
rubies = ["3.3", "3.4", "4.0"]
