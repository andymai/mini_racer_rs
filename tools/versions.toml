# Pinned developer and CI tool versions. The CI setup action and bin/setup read this file.
[cargo]
cargo-about = "0.9.2"
cargo-audit = "0.22.2"
cargo-deny = "0.20.2"
cargo-fuzz = "0.13.2"
cargo-machete = "0.9.2"
cargo-nextest = "0.9.143"
taplo-cli = "0.9.3"

[toolchains]
# Nightly for cargo-fuzz and sanitizer builds.
fuzz = "nightly-2026-10-01"
msrv = "1.91.0"

# Submodule pins: the tag each tracks and the commit that tag names.
[upstream.execjs]
commit = "b8a5855917b0cf368b1e6bf34958f92e5148dd88"
tag = "v2.10.2"

[upstream.mini_racer]
commit = "413b11963457f176a62c6ea240d7edaf01214e76"
tag = "v0.22.1"

# Native gems: one extension per Ruby minor, built to these platform floors;
# the musl gems build on the newest Alpine and are smoke-tested on `alpine`.
[release]
alpine = "3.20"
glibc = "2.35"
macos = "13.0"
rubies = ["3.3", "3.4", "4.0"]
